<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Globe — TAQA Arabia Global Footprint</title>
<meta name="description" content="Interactive globe of TAQA Arabia's operations: where we operate, what we do in each country, and every site by sector." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Fonts load non-blocking: the globe paints on the fallback stack and upgrades when they arrive. -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" /></noscript>
<link rel="stylesheet" href="globe.css" />
</head>
<body>

<div class="boot" id="boot">
  <div class="inner">
    <div class="ring"></div>
    <div class="msg">Building the globe…</div>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <a class="tb-btn" href="/taqa-bd-hub/" title="Back to the BD Hub">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      <span class="hide-sm">Hub</span>
    </a>
    <div class="brand">
      <img src="/taqa-bd-hub/assets/taqa-logo-Dn9QWtBK.png" alt="TAQA Arabia" onerror="this.style.display='none'" />
      <div class="titles">
        <div class="t1">Global Footprint</div>
        <div class="t2">Where we operate · what we do · where each site sits</div>
      </div>
    </div>

    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

    <div class="spacer"></div>

    <button class="tb-btn ghost" id="btn-search" title="Search countries, governorates, sectors and clients (press /)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="hide-sm">Search</span>
    </button>
    <button class="tb-btn ghost" id="btn-panel" title="Show or hide the panel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      <span class="hide-sm">Panel</span>
    </button>
  </header>

  <div class="stage" id="stage">
    <canvas id="globe"></canvas>
    <div class="vignette"></div>

    <aside class="panel" id="panel">
      <div class="panel-head" id="panel-head"></div>
      <div class="panel-body" id="panel-body"></div>
      <div class="panel-foot" id="panel-foot"></div>
    </aside>

    <div class="legend" id="legend">
      <div class="item"><span class="sw" style="background:#FFC10E"></span> Home market</div>
      <div class="item"><span class="sw" style="background:#2fbf6a"></span> Operating</div>
      <div class="item"><span class="sw" style="background:#e8a020"></span> Under study</div>
      <div class="item hide-sm"><span class="sw" style="background:#16243d;border:1px solid rgba(255,255,255,.18)"></span> No presence</div>
    </div>

    <div class="controls">
      <button class="ctl" id="ctl-in" title="Zoom in" aria-label="Zoom in">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="ctl" id="ctl-out" title="Zoom out" aria-label="Zoom out">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button class="ctl on" id="ctl-spin" title="Pause the rotation" aria-label="Toggle rotation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
      </button>
      <button class="ctl" id="ctl-home" title="Back to the world view" aria-label="Reset view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      </button>
      <button class="ctl" id="ctl-full" title="Fullscreen" aria-label="Fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
      </button>
    </div>

    <div class="tip" id="tip"></div>
  </div>
</div>

<div class="search-wrap" id="search-wrap">
  <div class="search-box" role="dialog" aria-label="Search">
    <div class="bar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8fa4c6" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="Search a country, governorate, sector, activity or client…" autocomplete="off" spellcheck="false" />
      <kbd>Esc</kbd>
    </div>
    <div class="results" id="search-results"></div>
  </div>
</div>

<script src="world.js"></script>
<script src="world-detail.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
